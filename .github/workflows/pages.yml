name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Neue Cache-Version pro Commit, damit installierte Apps Updates bekommen.
      - name: Cache-Version setzen
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/" sw.js

      - name: Dateien zusammenstellen
        run: |
          mkdir _site
          cp -r index.html styles.css app.js sw.js manifest.webmanifest icons _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
